name: Laravel CD (atl_laravel Production)

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Setup SSH & Deploy via Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEYPROD }}
          SSH_HOST: ${{ secrets.HOSTNAMEPROD }}
          SSH_USER: ${{ secrets.USERNAMEPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Starting deployment to /opt/project/atl_laravel..."

          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='/vendor' \
            --exclude='/node_modules' \
            --exclude='database/*.sqlite*' \
            --exclude='/storage/*.key' \
            --exclude='/storage/logs/*.log' \
            --exclude='/storage/framework/cache/data' \
            --exclude='/storage/framework/sessions' \
            --exclude='/storage/framework/views' \
            --exclude='/storage/app/firebase' \
            -e "ssh -i ~/.ssh/id_ed25519 -o ProxyCommand='cloudflared access ssh --hostname $SSH_HOST' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ $SSH_USER@$SSH_HOST:/opt/project/atl_laravel/

          echo "Files synced successfully!"

      - name: Execute Remote Post-Deployment Commands
        env:
          SSH_HOST: ${{ secrets.HOSTNAMEPROD }}
          SSH_USER: ${{ secrets.USERNAMEPROD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ProxyCommand="cloudflared access ssh --hostname $SSH_HOST" -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            cd /opt/project/atl_laravel

            echo "Installing composer dependencies on server..."
            php8.4 /usr/local/bin/composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "Running database migrations..."
            php8.4 artisan migrate --force

            echo "Optimizing Laravel Cache..."
            php8.4 artisan optimize:clear
            php8.4 artisan config:cache
            php8.4 artisan route:cache
            php8.4 artisan view:cache

            echo "All post-deploy steps completed!"
          EOF