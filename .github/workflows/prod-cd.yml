name: Laravel CD (atl_laravel Production)

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

            - name: Setup SSH & Deploy via Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEYPROD }}
          SSH_HOST: ${{ secrets.HOSTNAMEPROD }}
          SSH_USER: ${{ secrets.USERNAMEPROD }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Put the proxy config in ssh config so both steps share it
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
          EOF
          chmod 600 ~/.ssh/config

          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='/vendor' \
            --exclude='/node_modules' \
            --exclude='database/*.sqlite*' \
            --exclude='/storage/*.key' \
            --exclude='/storage/logs/*.log' \
            --exclude='/storage/framework/cache/data' \
            --exclude='/storage/framework/sessions' \
            --exclude='/storage/framework/views' \
            --exclude='/storage/app/firebase' \
            -e ssh \
            ./ deploy-target:/opt/project/atl_laravel/

      - name: Execute Remote Post-Deployment Commands
        run: |
          ssh deploy-target << 'EOF'
          cd /opt/project/atl_laravel
          php8.4 /usr/local/bin/composer install --no-interaction --prefer-dist --optimize-autoloader
          php8.4 artisan migrate --force
          php8.4 artisan optimize:clear
          php8.4 artisan config:cache
          php8.4 artisan route:cache
          php8.4 artisan view:cache
          EOF
          
      - name: Debug tunnel
        run: |
          curl -sI https://${{ secrets.HOSTNAMEPROD }} \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" | head -n 5